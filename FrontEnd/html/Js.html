<!DOCTYPE html>
<html lang="es-Es">
<head>
    <meta charset="UTF-8">
    <script src="../js/script.js" defer></script>   <!--enlace a un archivo de javascript, defer hace que se ejecute despues de cargar el html, evitando errores-->
    <!--Se puede usar type="module" para varios archivos no necesita defer-->
    <title>JavaScript</title>
</head>

<body>
    <H1 class="H1"></H1>

    <label for="text">Ingrese un valor:</label>
    <input type="text" name="text" id="text">
    <label for="si">¿Está de acuerdo?</label>
    <input type="checkbox" name="si" id="si"><br>

    <button onclick="boton()">Boton con funcion en html</button>        <!--Boton, pero con onclick en html-->
    <br>
    <button id="listener-btn" value="pez">Boton con Listeners</button>

    <input type="submit" value="Enviar, con onclick en js" id="submit">
</body>
</html>
