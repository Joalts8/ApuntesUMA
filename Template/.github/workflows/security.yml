name: DevSecOps & Security Analysis

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!develop'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Análisis semanal programado (lunes a las 03:00 UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      run_strix:
        description: '¿Ejecutar análisis dinámico/pen-testing con Strix (AI Pentesting)?'
        type: boolean
        default: false
      run_noir:
        description: '¿Ejecutar mapeo de superficie de ataque de endpoints con OWASP Noir?'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write  # Necesario para subir reportes SARIF a la pestaña Security de GitHub
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST & Secrets (Universal - Aplicable a cualquier stack: Web, App, CLI, etc.)
  # ---------------------------------------------------------------------------
  universal-sast-and-secrets:
    name: Escaneo de Secretos y SAST Universal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1.1 Detección de Secretos y Credenciales hardcodeadas (TruffleHog)
      - name: Detección de secretos (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          extra_args: --only-verified

      # 1.2 SAST Universal agnóstico al lenguaje (Semgrep OSS)
      - name: SAST Multi-lenguaje (Semgrep OSS)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config p/default --sarif --output=/src/semgrep.sarif || true

      - name: Subir resultados Semgrep (SARIF) a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 2. SCA & Vulnerabilidades de Dependencias y Contenedores (Trivy)
  # ---------------------------------------------------------------------------
  dependency-and-container-scan:
    name: SCA de Dependencias y Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Escanea dependencias (pom.xml, package.json, requirements.txt, go.mod, etc.) y Dockerfiles
      - name: Escaneo de vulnerabilidades en dependencias y Dockerfile (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Subir reporte Trivy (SARIF) a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 3. OWASP Noir: Mapeo de Superficie de Ataque y Endpoints
  # * Aplicable a: Proyectos con APIs, Web, Microservicios o backends
  # * Ejecución directa mediante contenedor oficial (evita scripts externos no verificados)
  # ---------------------------------------------------------------------------
  noir-attack-surface:
    name: Mapeo de Endpoints (OWASP Noir)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_noir == true || github.event.inputs.run_noir == 'true'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar análisis de superficie con Noir
        run: |
          mkdir -p security-reports
          echo "Ejecutando Noir sobre el código del repositorio..."
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ghcr.io/owasp-noir/noir:latest -b /workspace -f json -o /workspace/security-reports/noir-endpoints.json || true

      - name: Subir inventario de endpoints Noir como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noir-attack-surface-report
          path: security-reports/noir-endpoints.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Strix: AI Penetration Testing & Vulnerability Verification
  # * Se ejecuta bajo demanda (workflow_dispatch) cuando el usuario lo activa manualmente
  # ---------------------------------------------------------------------------
  strix-ai-pentest:
    name: Dynamic AI Pentesting (Strix)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.run_strix == true || github.event.inputs.run_strix == 'true')
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Strix Agent
        run: pipx install strix-agent

      - name: Ejecutar auditoría asistida por IA con Strix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIX_API_KEY: ${{ secrets.STRIX_API_KEY }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ANTHROPIC_API_KEY || secrets.STRIX_API_KEY }}
        run: |
          mkdir -p security-reports
          echo "Iniciando Strix Pentesting en modo no-destructivo..."
          strix -n --target ./ 2>&1 | tee security-reports/strix-summary.txt || true

      - name: Subir informe de pentesting de Strix
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-pentest-report
          path: security-reports/
          retention-days: 7
