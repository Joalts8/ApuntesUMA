name: CD - Despliegue Continuo (Docker Hub & GitHub Container Registry)

on:
  # Al mergearse un PR en main o develop (o push derivado de ese merge) y tags de release
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Necesario para publicar en ghcr.io (GitHub Packages / Container Registry)

jobs:
  build-and-push:
    name: Construir y Publicar Imagen Docker
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dar permisos de ejecución
        run: |
          if [ -f "./mvnw" ]; then chmod +x ./mvnw; fi
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Compilar y empaquetar aplicación Spring Boot
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean package -DskipTests --no-transfer-progress
          elif [ -f "./gradlew" ]; then
            ./gradlew bootJar -x test
          elif [ -f "./pom.xml" ]; then
            mvn clean package -DskipTests
          else
            echo "Sin proyecto Java detectado. Creando binario placeholder para validación de Docker..."
            mkdir -p target && touch target/app-demo.jar
          fi

      - name: Configurar Docker QEMU (Multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        # Evalúa variable env a nivel de job para evitar errores de sintaxis con 'secrets' en 'if'
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Iniciar sesión en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombres de imágenes Docker (normalización a minúsculas)
        id: prep
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USER" ]; then
            USER_LC="${DOCKERHUB_USER,,}"
            echo "images<<EOF" >> $GITHUB_OUTPUT
            echo "ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
            echo "${USER_LC}/app" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "images=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
          fi

      - name: Extraer metadatos y etiquetas para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Construir y Publicar Imagen en Registries
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Notificación de Despliegue
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notificar publicación exitosa
        run: |
          echo "Imágenes docker generadas y publicadas con éxito."
          echo "Disponibles en ghcr.io y Docker Hub."
