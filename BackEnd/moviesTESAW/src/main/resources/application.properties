# Prefijos y sufijos para las vistas que se pasan en el controlador
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# Ajustes de la BD: Conexión, usuario, contraseña, driver, generación de nombre único
spring.datasource.url=jdbc:derby:db    
spring.datasource.username=sampleTAW
spring.datasource.password=sampleTAW
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.generate-unique-name=true

# Ajustes de JPA: Esquema por defecto, dialecto, mostrar SQL, generación de DDL
spring.jpa.properties.hibernate.default_schema=MOVIES
spring.jpa.database-platform=org.hibernate.dialect.DerbyTenSevenDialect
spring.jpa.show-sql=true
#spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=none
